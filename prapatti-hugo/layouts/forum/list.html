{{ define "main" }}
<div class="container page-content">
  <h1 class="page-title">Guestbook</h1>

  <!-- Existing entries -->
  <div style="margin-bottom:2rem">
    <h2 class="section-title" style="margin-bottom:1rem">Recent Entries</h2>
    <div id="gb-entries"><p style="color:#7a6a50;font-size:0.9rem">Loading entries…</p></div>
  </div>

  <div class="gb-form-wrap">
    <h2 class="section-title" style="margin-bottom:1rem">Sign the Guestbook</h2>
    <form id="gb-form">
      <input type="text" name="honeypot" style="display:none" tabindex="-1" autocomplete="off">
      <div class="gb-form-row">
        <div class="gb-col-msg">
          <div class="gb-field">
            <label>Your message *</label>
            <textarea name="message" rows="6" required></textarea>
          </div>
        </div>
        <div class="gb-col-meta">
          <div class="gb-field">
            <label>Your Name *</label>
            <input type="text" name="author" required>
          </div>
          <div class="gb-field">
            <label>Email <span class="gb-hint">(not displayed)</span></label>
            <input type="email" name="email">
          </div>
          <div class="gb-field">
            <label>Location</label>
            <input type="text" name="location" placeholder="City, Country">
          </div>
        </div>
      </div>
      <div class="cf-turnstile" data-sitekey="0x4AAAAAADEeatJirTFtCkno" data-theme="light"></div>
      <button type="submit" class="btn btn-gold" style="margin-top:0.75rem">Submit</button>
      <p id="gb-status" style="margin-top:0.75rem;font-size:0.9rem"></p>
    </form>
  </div>

</div>

<style>
.gb-form-wrap { background:#fff; border:1px solid #e8e0cc; border-radius:8px; padding:1.5rem 2rem; max-width:820px; }
.gb-form-row { display:flex; gap:1.5rem; }
.gb-col-msg { flex:7; }
.gb-col-meta { flex:5; }
@media(max-width:600px) { .gb-form-row { flex-direction:column; } }
.gb-field { margin-bottom:1rem; }
.gb-field label { display:block; font-size:0.88rem; font-weight:600; margin-bottom:0.3rem; color:#3a2e1e; }
.gb-field input, .gb-field textarea { width:100%; border:1px solid #c8bfa0; border-radius:4px; padding:0.45rem 0.7rem; font-family:'DM Sans',sans-serif; font-size:0.9rem; background:#FDFAF4; }
.gb-field input:focus, .gb-field textarea:focus { outline:none; border-color:#8B6914; }
.gb-hint { font-weight:400; color:#7a6a50; }
.gb-entry { background:#fff; border:1px solid #e8e0cc; border-radius:8px; padding:1.25rem 1.5rem; margin-bottom:1rem; }
.gb-entry-meta { font-size:0.8rem; color:#7a6a50; margin-bottom:0.5rem; }
.gb-entry-msg { font-family:'Crimson Pro',serif; font-size:1.05rem; line-height:1.7; color:#1C1410; white-space:pre-wrap; }
.gb-reply { background:#f5edda; border-left:3px solid #8B6914; padding:0.75rem 1rem; margin-top:0.75rem; border-radius:0 4px 4px 0; font-size:0.9rem; }
.gb-reply-label { font-size:0.78rem; font-weight:600; color:#8B6914; margin-bottom:0.25rem; }
</style>

<script>
const API = "https://prapatti-guestbook.sumedharaghu.workers.dev";

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return isNaN(d) ? ts : d.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
}

function renderEntries(entries) {
  const container = document.getElementById('gb-entries');
  if (!entries.length) { container.innerHTML = '<p style="color:#7a6a50;font-size:0.9rem">No entries yet.</p>'; return; }
  container.innerHTML = entries.map(e => `
    <div class="gb-entry">
      <div class="gb-entry-meta"><strong>${escHtml(e.author)}</strong>${e.location ? ' &middot; <i>' + escHtml(e.location) + '</i>' : ''} &middot; <span>${formatDate(e.timestamp)}</span></div>
      <div class="gb-entry-msg">${escHtml(e.message).replace(/\n/g,'<br>')}</div>
      ${e.reply ? `<div class="gb-reply"><div class="gb-reply-label">Reply from Prapatti:</div>${escHtml(e.reply).replace(/\n/g,'<br>')}</div>` : ''}
    </div>
  `).join('');
}

fetch(`${API}/entries`)
  .then(r => r.json())
  .then(d => renderEntries(d.entries || []))
  .catch(() => { document.getElementById('gb-entries').innerHTML = '<p style="color:#8B1914;font-size:0.9rem">Could not load entries.</p>'; });

document.getElementById('gb-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const status = document.getElementById('gb-status');
  const fd = new FormData(this);
  const body = { author: fd.get('author'), email: fd.get('email'), location: fd.get('location'), message: fd.get('message'), honeypot: fd.get('honeypot'), turnstileToken: fd.get('cf-turnstile-response') };
  status.textContent = 'Submitting…';
  try {
    const res = await fetch(`${API}/submit`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const data = await res.json();
    if (data.ok) { this.reset(); status.style.color = '#2a6a2a'; status.textContent = 'Thank you! Your entry will appear after review.'; }
    else { status.style.color = '#8B1914'; status.textContent = data.error || 'Error submitting.'; }
  } catch { status.style.color = '#8B1914'; status.textContent = 'Network error. Please try again.'; }
});

</script>
{{ end }}
