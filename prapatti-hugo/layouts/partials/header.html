<header>

      <a href="/guestbook/" class="nav-link{{ if eq .Section "guestbook" }} active{{ end }}">Guestbook</a>

    <div class="nav-brand">

      </div>
    </div>

      <div id="search-results"></div>
    </div>
    </div>
  </div>
  <div class="site-banner">
